<h1>手搓魔法 · 待确认两项</h1>
<h2>1. 掌贴掌 CG：男右女左 vs 女右男左</h2><p>主界面上薇丝塔在左、主角在右。「男右女左」就是把原图水平翻转，和主界面一致；画面里没有文字，翻转后没有破绽。</p>
<div class=r><figure><img src=camp.jpg><figcaption>参照：主界面（女左 男右）</figcaption></figure><figure><img src=flip.jpg><figcaption>A · 男右女左（翻转，和主界面一致）</figcaption></figure><figure><img src=orig.jpg><figcaption>B · 女右男左（当前）</figcaption></figure></div>
<h2>2. 有新印记时：主角加弱发光的轮廓描边</h2><p>原来叠在主角身上的光点、光圈都去掉了，改成沿着主角轮廓的一圈柔光，慢慢呼吸。有新印记时用那个印记的颜色（偏亮）；平时有两种选法：极淡的金边，或者不显示。</p>
<div class=r><figure><img src=hero_outline_new_zoom.jpg><figcaption>有新印记（放大 2 倍）</figcaption></figure><figure><img src=hero_outline_idle_zoom.jpg><figcaption>平时 · 极淡金边（放大 2 倍）</figcaption></figure><figure><img src=hero_outline_idle_none_zoom.jpg><figcaption>平时 · 不显示（放大 2 倍）</figcaption></figure></div>
